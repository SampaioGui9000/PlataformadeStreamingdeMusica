apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "playcatch.name" . }}
  labels: {{- include "playcatch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "playcatch.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "playcatch.name" . }}
        version: v1
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - secretRef:
                name: {{ include "playcatch.name" . }}-db
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
