apiVersion: v1
kind: Secret
metadata:
  name: {{ include "playcatch.name" . }}-db
  labels: {{- include "playcatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "playcatch.name" . }}-postgres:5432/{{ .Values.postgres.database }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
