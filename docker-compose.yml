services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playcatch
      POSTGRES_PASSWORD: playcatch
      POSTGRES_DB: playcatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playcatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://playcatch:playcatch@db:5432/playcatch
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
